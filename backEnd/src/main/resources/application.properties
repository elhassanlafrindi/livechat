spring.application.name=livechat

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/livechat
spring.datasource.username=livechat
spring.datasource.password=livechat
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-123456}
app.jwt.expiration-minutes=1440
